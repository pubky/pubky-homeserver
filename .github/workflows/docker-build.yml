name: Build Docker Images

on:
  workflow_call:
    inputs:
      architecture:
        description: Native architecture for checks (amd64 or arm64); publishing always builds both
        type: string
        default: amd64
      build_profile:
        description: Docker build profile (debug or release)
        type: string
        required: true
      publish:
        description: Publish images to Docker Hub with version and latest tags
        type: boolean
        default: false
    secrets:
      DOCKERHUB_USERNAME:
        required: false
      DOCKERHUB_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ inputs.publish && 'ubuntu-latest' || inputs.architecture == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 150
    strategy:
      matrix:
        include:
          - image: homeserver-testnet
            target: testnet
          - image: homeserver
            target: homeserver
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Log in to Docker Hub
        if: ${{ inputs.publish }}
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Select build settings
        id: settings
        shell: bash
        env:
          PUBLISH: ${{ inputs.publish }}
          ARCHITECTURE: ${{ inputs.architecture }}
          CACHE_SCOPE: docker-${{ inputs.build_profile }}-${{ matrix.target }}
        run: |
          if [[ "$PUBLISH" == "true" ]]; then
            # Publishing imports native caches from main without exporting.
            architectures=(amd64 arm64)
            cache_to=''
          else
            case "$ARCHITECTURE" in
              amd64|arm64) architectures=("$ARCHITECTURE") ;;
              *) echo "Unsupported architecture: $ARCHITECTURE" >&2; exit 1 ;;
            esac
            cache_to="type=gha,scope=${CACHE_SCOPE}-${ARCHITECTURE},mode=max"
          fi

          platforms=''
          {
            echo 'cache_from<<EOF'
            for architecture in "${architectures[@]}"; do
              platforms+="linux/${architecture},"
              echo "type=gha,scope=${CACHE_SCOPE}-${architecture}"
            done
            echo 'EOF'
            echo "platforms=${platforms%,}"
            echo "cache_to=$cache_to"
          } >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        uses: pubky/ci-workflows/.github/actions/docker/build_and_push@5faaf004d36bb93a204b58cf7190ffe7fbcce16f
        with:
          registry: registry-1.docker.io/synonymsoft
          context: .
          push: ${{ inputs.publish }}
          latest: ${{ inputs.publish }}
          tags: |
            type=ref,event=tag
          platforms: ${{ steps.settings.outputs.platforms }}
          image: ${{ matrix.image }}
          cache_from: ${{ steps.settings.outputs.cache_from }}
          cache_to: ${{ steps.settings.outputs.cache_to }}
          build_args: |
            BUILD_TARGET=${{ matrix.target }}
            BUILD_PROFILE=${{ inputs.build_profile }}
