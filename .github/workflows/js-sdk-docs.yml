name: JS SDK Docs

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: js-sdk-docs-pages
  cancel-in-progress: true

# NOTE: deploy-pages replaces the *entire* GitHub Pages site.
# If another workflow needs to publish to Pages, consolidate both
# into a single deployment so content is not overwritten.

jobs:
  build:
    name: Build docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: pubky-sdk/bindings/js/pkg/package-lock.json
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - name: Cache
        uses: Swatinem/rust-cache@v2
      - name: Install JS dependencies
        working-directory: pubky-sdk/bindings/js/pkg
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: Build JS bindings (generates pubky.d.ts)
        working-directory: pubky-sdk/bindings/js/pkg
        run: npm run build
      - name: Generate API docs
        working-directory: pubky-sdk/bindings/js/pkg
        run: npm run docs
      - name: Place docs under /js-sdk/ subpath
        run: |
          mkdir -p _site/js-sdk-typedoc
          cp -r pubky-sdk/bindings/js/pkg/docs/* _site/js-sdk-typedoc/
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
