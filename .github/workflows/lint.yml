name: Lint

# Formatting, lints, dependency checks and the minimum supported Rust version.
on:
  pull_request:
  push:
    branches: [main]

# A new push to a pull request cancels its older runs. Runs on main finish, so
# they save the caches that pull requests restore.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The Rust caches are saved only on main. Pull requests restore them without
# saving, so they don't evict the caches of main from the repository's cache.
jobs:
  deny:
    name: Cargo Deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-deny
      - name: Check licenses, sources, advisories, and bans
        run: cargo deny check sources licenses advisories bans

  msrv:
    name: msrv
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up MSRV toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.91"
      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Verify MSRV
        run: cargo check --workspace --all-features

  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.91"
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.91"
          components: clippy
      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Lint host crates and all Cargo targets
        run: cargo clippy --workspace --all-features --all-targets -- -D warnings

      - name: Install WASM compilation target
        run: rustup target add wasm32-unknown-unknown

      - name: Lint WASM bindings and tests
        run: cargo clippy -p pubky-wasm --lib --tests --target wasm32-unknown-unknown -- -D warnings

  helper-crates:
    name: helper crates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.91"
          components: rustfmt, clippy
      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Check excluded helper crates
        run: |
          set -e
          for manifest in \
            test_utils/drop_db_helper/Cargo.toml \
            test_utils/test_macro/Cargo.toml \
            test_utils/pubky_test/Cargo.toml
          do
            cargo fmt --check --manifest-path "$manifest"
            cargo clippy --manifest-path "$manifest" --all-targets -- -D warnings
            cargo test --manifest-path "$manifest"
          done
