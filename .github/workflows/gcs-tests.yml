name: GCS Tests

# The homeserver tests marked `#[ignore]` that run against a real Google Cloud
# Storage bucket, see docs/TESTING.md. Nightly too, because Dependabot pull
# requests don't get the credentials: a dependency bump is tested on GCS at
# the latest the night after it merged.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

jobs:
  credentials:
    runs-on: ubuntu-latest
    outputs:
      available: ${{ steps.check.outputs.available }}
    steps:
      - id: check
        env:
          # Secrets can't be checked in an `if`. Pull requests from forks and
          # Dependabot don't get them.
          HAS_GCS: ${{ secrets.GCS_CI_CREDENTIALS != '' }}
        run: |
          echo "available=$HAS_GCS" >> "$GITHUB_OUTPUT"
          if [ "$HAS_GCS" = "true" ]; then
            exit 0
          fi
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "::warning::This pull request gets no GCS credentials; the GCS tests are skipped."
          else
            echo "::error::The GCS_CI_CREDENTIALS secret is missing."
            exit 1
          fi

  test-gcs:
    needs: credentials
    if: needs.credentials.outputs.available == 'true'
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
          POSTGRES_DB: postgres
        ports: ['127.0.0.1:5432:5432']
        options: >-
          --health-cmd="pg_isready -U test_user"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5
    env:
      TEST_PUBKY_CONNECTION_STRING: postgres://test_user:test_pass@localhost:5432/postgres
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.91"
      - name: Install Nextest
        uses: taiki-e/install-action@nextest
      - name: Cache
        uses: Swatinem/rust-cache@v2
      - name: Configure the GCS test bucket
        env:
          GCS_CI_CREDENTIALS: ${{ secrets.GCS_CI_CREDENTIALS }}
          GCS_CI_BUCKET: ${{ vars.GCS_CI_BUCKET }}
        run: |
          credentials="$RUNNER_TEMP/gcs-credentials.json"
          printf '%s' "$GCS_CI_CREDENTIALS" > "$credentials"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$credentials" >> "$GITHUB_ENV"
          echo "GCS_BUCKET=$GCS_CI_BUCKET" >> "$GITHUB_ENV"
      - name: Run the GCS tests
        # Each test works under a prefix of its own, `ci/<run id>/<uuid>` or
        # its users' keys, and deletes it when done. A lifecycle rule on the bucket deletes what a
        # killed test leaves.
        run: |
          cargo nextest run -p pubky-homeserver --all-features \
            --run-ignored only -E 'test(/gcs/)' \
            --retries 2 --no-fail-fast
