name: Test

# The tests of each crate, the WASM bindings, and each storage backend, see
# docs/TESTING.md.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

env:
  # Line tables keep file and line numbers in backtraces, but make the builds
  # and their caches much smaller than full debug info.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

# The Rust caches are saved only on main. Pull requests restore them without
# saving, so they don't evict the caches of main from the repository's cache.
jobs:
  test:
    name: ${{ matrix.crate }}
    services:
      postgres:
        image: postgres:18-alpine          # official image
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
          POSTGRES_DB: postgres
        ports: ['127.0.0.1:5432:5432']      # optional – makes it reachable on localhost
        options: >-                         # give the container a health check
          --health-cmd="pg_isready -U test_user"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5

    env:
      # Your code can read these, or just use the defaults above
      TEST_PUBKY_CONNECTION_STRING: postgres://test_user:test_pass@localhost:5432/postgres

    strategy:
      matrix:
        crate:
          [
            pubky,
            pubky-common,
            pubky-homeserver,
            pubky-testnet,
            homeservercli,
            e2e,
          ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.91"
      - name: Install Nextest
        uses: taiki-e/install-action@nextest
      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          # Each crate builds different tests, so each needs a cache of its own.
          shared-key: test-${{ matrix.crate }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Wait for PostgreSQL
        run: |
          for i in {1..10}; do
            pg_isready -h localhost -p 5432 -U test_user && break
            echo "Postgres not ready yet… sleeping"
            sleep 3
          done
      - name: Run doctests and nextest
        run: |
          set -e
          # nextest does not support doctests yet.
          if [ "${{ matrix.crate }}" != "homeservercli" ]; then
            cargo test --doc -p ${{ matrix.crate }} --all-features
          fi

          if cargo nextest run \
            -p ${{ matrix.crate }} \
            --all-features \
            --test-threads num-cpus \
            --retries 2 \
            --no-fail-fast \
            --verbose; then
            echo "Tests passed for ${{ matrix.crate }}"
          else
            if [ $? -eq 4 ]; then
              echo "No tests found for ${{ matrix.crate }}"
              exit 0
            else
              echo "Tests failed for ${{ matrix.crate }}"
              exit 1
            fi
          fi

  wasm-test:
    name: wasm
    services:
      postgres:
        image: postgres:18-alpine          # official image
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
          POSTGRES_DB: postgres
        ports: ['127.0.0.1:5433:5432']      # optional – makes it reachable on localhost
        options: >-                         # give the container a health check
          --health-cmd="pg_isready -U test_user"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5
    env:
      # Your code can read these, or just use the defaults above
      TEST_PUBKY_CONNECTION_STRING: postgres://test_user:test_pass@localhost:5433/postgres

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.91"
          target: wasm32-unknown-unknown

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: pubky-sdk/bindings/js/pkg/package-lock.json

      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack

      - name: Install JS dependencies
        working-directory: pubky-sdk/bindings/js/pkg
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Run wasm-pack unit tests
        working-directory: pubky-sdk/bindings/js
        run: wasm-pack test --node

      - name: Install Electron/X deps
        run: |
          set -eux
          sudo apt-get update
          # base deps (don’t include libasound here so a single missing package doesn’t abort)
          sudo apt-get install -y --no-install-recommends \
            xvfb \
            libgtk-3-0 \
            libnss3 \
            libxss1 \
            libx11-xcb1 \
            libxcb-dri3-0 \
            libdrm2 \
            libgbm1 \
            libxdamage1 \
            libxshmfence1 \
            libxtst6
          # asound: Ubuntu 24.04 uses libasound2t64; older images still use libasound2
          sudo apt-get install -y --no-install-recommends libasound2t64 || \
          sudo apt-get install -y --no-install-recommends libasound2

      - name: Sanity Check (Electron works)
        run: xvfb-run -a npx electron --no-sandbox --version

      - name: Build WASM
        working-directory: pubky-sdk/bindings/js/pkg
        run: |
          npm run build

      - name: Run the testnet
        working-directory: pubky-sdk/bindings/js/pkg
        run: npm run testnet > testnet.log 2>&1 &

      - name: Wait for testnet homeserver and HTTP relay
        run: |
          timeout=180
          count=0
          until nc -zv 127.0.0.1 6286; do
            if [ $count -ge $timeout ]; then
              echo "Timeout: Testnet homeserver did not start within 3 minutes."
              exit 1
            fi
            echo "Waiting for testnet homeserver to be ready... ($count/$timeout)"
            sleep 1
            count=$((count + 1))
          done
          echo "Testnet homeserver is ready."

          count=0
          until nc -zv 127.0.0.1 15412; do
            if [ $count -ge $timeout ]; then
              echo "Timeout: HTTP relay did not start within 3 minutes."
              exit 1
            fi
            echo "Waiting for HTTP relay to be ready... ($count/$timeout)"
            sleep 1
            count=$((count + 1))
          done
          echo "HTTP relay is ready."

      - name: Node tests
        working-directory: pubky-sdk/bindings/js/pkg
        run: npm run test-nodejs

      - name: Browser tests (Electron under Xvfb)
        working-directory: pubky-sdk/bindings/js/pkg
        env:
          ELECTRON_DISABLE_SANDBOX: "1" # CI-safe
        run: |
          npx electron --version || true
          xvfb-run -a npm run test-browser:ci
          xvfb-run -a npm run test-browser:tabs -- --no-sandbox

      - name: Show testnet logs if tests fail
        working-directory: pubky-sdk/bindings/js/pkg
        if: failure()
        run: cat testnet.log

  docker-postgres-test:
    name: pubky-testnet (docker-postgres)
    # This job tests the docker-postgres feature WITHOUT an external postgres service
    # to verify that the Docker-managed postgres works as a standalone solution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.91"
      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Run docker postgres tests
        run: |
          cargo test -p pubky-testnet \
            --features docker-postgres \
            docker_postgres \
            -- --test-threads=1

  # The storage tests of each backend, one check per backend. The memory and
  # file system tests also run in the pubky-homeserver job.
  storage:
    name: storage (${{ matrix.backend }})
    strategy:
      fail-fast: false
      matrix:
        backend: [memory, file_system]
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
          POSTGRES_DB: postgres
        ports: ['127.0.0.1:5432:5432']
        options: >-
          --health-cmd="pg_isready -U test_user"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5
    env:
      TEST_PUBKY_CONNECTION_STRING: postgres://test_user:test_pass@localhost:5432/postgres
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.91"
      - name: Install Nextest
        uses: taiki-e/install-action@nextest
      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          # The pubky-homeserver job builds the same tests and saves the cache.
          shared-key: test-pubky-homeserver
          save-if: false
      - name: Run the ${{ matrix.backend }} tests
        run: |
          cargo nextest run -p pubky-homeserver --all-features \
            -E 'test(/::${{ matrix.backend }}::/)' \
            --retries 2 --no-fail-fast

  # Pull requests from forks and Dependabot get no secrets: the job then
  # passes with a warning. Outside pull requests, a missing secret fails it.
  storage-gcs:
    name: storage (gcs)
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
          POSTGRES_DB: postgres
        ports: ['127.0.0.1:5432:5432']
        options: >-
          --health-cmd="pg_isready -U test_user"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5
    env:
      TEST_PUBKY_CONNECTION_STRING: postgres://test_user:test_pass@localhost:5432/postgres
    runs-on: ubuntu-latest
    steps:
      - name: Check for the GCS credentials
        id: credentials
        env:
          # Secrets can't be checked in an `if`.
          HAS_GCS: ${{ secrets.GCS_CI_CREDENTIALS != '' }}
        run: |
          echo "available=$HAS_GCS" >> "$GITHUB_OUTPUT"
          if [ "$HAS_GCS" = "true" ]; then
            exit 0
          fi
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "::warning::This pull request gets no GCS credentials; the GCS tests are skipped."
          else
            echo "::error::The GCS_CI_CREDENTIALS secret is missing."
            exit 1
          fi
      - uses: actions/checkout@v7
        if: steps.credentials.outputs.available == 'true'
      - name: Set up Rust
        if: steps.credentials.outputs.available == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.91"
      - name: Install Nextest
        if: steps.credentials.outputs.available == 'true'
        uses: taiki-e/install-action@nextest
      - name: Cache
        if: steps.credentials.outputs.available == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          # The pubky-homeserver job builds the same tests and saves the cache.
          shared-key: test-pubky-homeserver
          save-if: false
      - name: Configure the GCS test bucket
        if: steps.credentials.outputs.available == 'true'
        env:
          GCS_CI_CREDENTIALS: ${{ secrets.GCS_CI_CREDENTIALS }}
          GCS_CI_BUCKET: ${{ vars.GCS_CI_BUCKET }}
        run: |
          credentials="$RUNNER_TEMP/gcs-credentials.json"
          printf '%s' "$GCS_CI_CREDENTIALS" > "$credentials"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$credentials" >> "$GITHUB_ENV"
          echo "GCS_BUCKET=$GCS_CI_BUCKET" >> "$GITHUB_ENV"
      - name: Run the gcs tests
        if: steps.credentials.outputs.available == 'true'
        # The GCS tests are ignored unless asked for. Each works under a
        # prefix of its own and deletes it when done. A lifecycle rule on the
        # bucket deletes what a killed test leaves.
        run: |
          cargo nextest run -p pubky-homeserver --all-features \
            --run-ignored only -E 'test(/gcs/)' \
            --retries 2 --no-fail-fast
