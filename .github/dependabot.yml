version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      time: "08:00"
      day: "tuesday"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "deps"
    rebase-strategy: "auto"
    # Cover both direct and transitive deps
    allow:
      - dependency-type: "all"
    groups:
      cargo-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      time: "08:00"
      day: "tuesday"
    commit-message:
      prefix: "deps"
    cooldown:
      default-days: 7
    groups:
      docker-images:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      time: "08:00"
      day: "tuesday"
    commit-message:
      prefix: "ci"
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"
