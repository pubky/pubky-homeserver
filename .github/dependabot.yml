version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      time: "08:00"
      day: "tuesday"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "deps"
    rebase-strategy: "auto"
    # Cover both direct and transitive deps
    allow:
      - dependency-type: "all"
    ignore:
      # sqlx 0.9 requires rustc 1.94 (workspace MSRV is 1.91) and rejects
      # dynamic query strings unless wrapped in `AssertSqlSafe`, which needs a
      # port of the persistence layer. Lift once MSRV and code are upgraded.
      - dependency-name: "sqlx"
        versions: [">= 0.9"]
      - dependency-name: "sea-query-sqlx"
        versions: [">= 0.9"]
    groups:
      cargo-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directories:
      - "/pubky-sdk/bindings/js/pkg"
      - "/examples/javascript"
      - "/examples/javascript/2-auth-flow"
      - "/examples/javascript/5-browser-session-persistence"
    schedule:
      interval: "weekly"
      time: "08:00"
      day: "tuesday"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "deps"
    allow:
      - dependency-type: "all"
    groups:
      npm-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      time: "08:00"
      day: "tuesday"
    commit-message:
      prefix: "deps"
    cooldown:
      default-days: 7
    groups:
      docker-images:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      time: "08:00"
      day: "tuesday"
    commit-message:
      prefix: "ci"
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"
