<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Session agent</title>
  <style>
    body { font: 14px/1.4 system-ui, sans-serif; margin: 16px; color: #222; }
    code { background: #f3f3f3; padding: 1px 4px; word-break: break-all; }
    button, a.button { font: inherit; padding: 6px 10px; }
    #log { white-space: pre-wrap; color: #555; margin-top: 12px; font-size: 12px; }
  </style>
</head>
<body>
  <p id="status">Starting…</p>
  <div id="signin" hidden>
    <p>Scan with Pubky Ring, or on a phone tap the link:</p>
    <p><a id="ring" class="button" target="_top">Open Pubky Ring</a></p>
    <p><code id="auth-url"></code></p>
    <p><button id="approve">Approve with a throwaway testnet account (stand-in for Ring)</button></p>
  </div>
  <p><button id="signout" hidden>Sign out</button></p>
  <div id="log"></div>

  <script type="module" src="./agent.js"></script>
</body>
</html>
