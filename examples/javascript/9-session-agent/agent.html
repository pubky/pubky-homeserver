<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Session agent</title>
  <!-- In production also send a Content-Security-Policy with
       `frame-ancestors` listing the same origins as ALLOWED below. -->
  <style>
    body { font: 14px/1.4 system-ui, sans-serif; margin: 16px; color: #222; }
    code { background: #f3f3f3; padding: 1px 4px; }
    #log { white-space: pre-wrap; color: #555; margin-top: 12px; }
  </style>
</head>
<body>
  <h1>Session agent <code id="origin"></code></h1>
  <p id="status">Starting…</p>
  <button id="signin" hidden>Sign in (testnet stand-in for Ring)</button>
  <button id="signout" hidden>Sign out</button>
  <div id="log"></div>

  <script type="module">
    import { Pubky, Keypair, PublicKey, AuthFlowKind } from "/pubky/index.js";

    // Exact origins that may use this agent. A sibling subdomain that is not
    // listed is refused even though it is same-site.
    const ALLOWED = ["http://localhost:8081", "http://localhost:8082", "http://127.0.0.1:8084"];
    const CLIENT_ID = "session-agent.example";
    const CAPABILITIES = "/pub/session-agent.example/:rw";
    const TESTNET_HOMESERVER = PublicKey.from("8pinxxgqs41n4aididenw5apqp1urfmzdztr8jt4abrkdn435ewo");
    const TESTNET_RELAY = "http://localhost:15412/inbox";

    const pubky = Pubky.testnet();
    const store = pubky.browserSessionStore;
    const $ = (id) => document.getElementById(id);
    const log = (line) => { $("log").textContent += `${new Date().toISOString().slice(11, 19)} ${line}\n`; };
    $("origin").textContent = location.origin;

    let session;

    // Restore the stored session first, then start serving: apps that connect
    // while we restore wait for an answer instead of seeing "no session". The
    // agent drops the session by itself when any tab signs it out.
    const [record] = await store.list();
    if (record) {
      try {
        session = await store.restore(record.id);
        log(`restored ${record.id}`);
      } catch (error) {
        log(`restore failed: ${error.message}`);
      }
    }
    const agent = pubky.serveSessionAgent(ALLOWED);
    if (session) agent.setSession(session);
    render();

    async function signin() {
      // Stand-in for Ring: a throwaway testnet account approves its own
      // grant request over the testnet relay. In production this page shows
      // the QR code / Passport popup instead.
      const signer = pubky.signer(Keypair.random());
      const token = await fetch("http://127.0.0.1:6288/generate_signup_token", {
        headers: { "X-Admin-Password": "admin" },
      }).then((r) => r.text());
      await signer.signup(TESTNET_HOMESERVER, token);
      const flow = await pubky.startGrantAuthFlow(CAPABILITIES, AuthFlowKind.signin(), {
        clientId: CLIENT_ID, relay: TESTNET_RELAY,
      });
      await signer.approveAuthRequest(flow.authorizationUrl);
      session = await flow.awaitApproval();
      await store.save(session);
      agent.setSession(session);
      log(`signed in as ${session.info.publicKey.z32()}`);
      render();
    }

    async function signout() {
      await session.signout();
      session = undefined;
      agent.clearSession();
      log("signed out");
      render();
    }

    function render() {
      $("status").textContent = session
        ? `Serving ${session.info.publicKey.z32()} to ${ALLOWED.join(", ")}`
        : "No session. Sign in to share one with the allowed origins.";
      $("signin").hidden = Boolean(session);
      $("signout").hidden = !session;
    }
    $("signin").onclick = () => signin().catch((e) => log(`sign-in failed: ${e.message}`));
    $("signout").onclick = () => signout().catch((e) => log(`sign-out failed: ${e.message}`));

  </script>
</body>
</html>
