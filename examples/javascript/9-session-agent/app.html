<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>App</title>
  <style>
    body { font: 14px/1.4 system-ui, sans-serif; margin: 16px; color: #222; }
    code { background: #f3f3f3; padding: 1px 4px; }
    #log { white-space: pre-wrap; color: #555; margin-top: 12px; }
  </style>
</head>
<body>
  <h1>App on <code id="origin"></code></h1>
  <p id="status">Connecting to the session agent…</p>
  <p id="signin" hidden>Not signed in. <a href="http://localhost:8083/agent.html" target="_blank">Sign in once on the agent</a>, then reload this page.</p>
  <p>
    <button id="write" disabled>Write a note as this app</button>
    <button id="read" disabled>Read every app's note</button>
    <button id="signout" disabled>Sign out everywhere</button>
  </p>
  <div id="log"></div>

  <script type="module">
    import { Pubky } from "/pubky/index.js";

    const AGENT_URL = "http://localhost:8083/agent.html";
    const NOTES = "/pub/session-agent.example/";

    const pubky = Pubky.testnet();
    const $ = (id) => document.getElementById(id);
    const log = (line) => { $("log").textContent += `${new Date().toISOString().slice(11, 19)} ${line}\n`; };
    const me = location.host.replace(":", "-");
    $("origin").textContent = location.origin;

    let session;

    async function connect() {
      // No prompt, no redirect: the hidden agent frame answers from its own
      // storage, which same-site embedders share.
      session = await pubky.connectSessionAgent(AGENT_URL, { timeoutMs: 8000 });
      render();
      return session?.info.publicKey.z32();
    }

    async function write(text = `hello from ${location.origin} at ${new Date().toISOString()}`) {
      await session.storage.putText(`${NOTES}${me}.txt`, text);
      log(`wrote ${NOTES}${me}.txt`);
    }

    async function readAll() {
      for (const url of await session.storage.list(NOTES)) {
        const path = new URL(url).pathname;
        log(`${path}: ${await session.storage.getText(path)}`);
      }
    }

    async function signout() {
      await session.signout();
      session = undefined;
      log("signed out via the agent");
      render();
    }

    function render() {
      $("status").textContent = session
        ? `Signed in as ${session.info.publicKey.z32()} (caps: ${session.info.capabilities.join(", ")})`
        : "";
      $("signin").hidden = Boolean(session);
      for (const id of ["write", "read", "signout"]) $(id).disabled = !session;
    }
    $("write").onclick = () => write().catch((e) => log(`write failed: ${e.message}`));
    $("read").onclick = () => readAll().catch((e) => log(`read failed: ${e.message}`));
    $("signout").onclick = () => signout().catch((e) => log(`sign-out failed: ${e.message}`));

    connect().catch((error) => {
      $("status").textContent = `Agent connection failed: ${error.message}`;
      log(error.message);
    });
  </script>
</body>
</html>
