# Detects dependency and licenses issues
#
# https://github.com/EmbarkStudios/cargo-deny
# https://embarkstudios.github.io/cargo-deny/checks/cfg.html
# https://github.com/EmbarkStudios/cargo-deny/blob/main/deny.template.toml
#
# Install locally: cargo install --locked cargo-deny
# Run locally: cargo deny check advisories bans licenses sources

[graph]
all-features = true

[advisories]
# GCS authentication uses blinded RSA signing, with no exposed RSA decryption
# path. Accept residual signing timing risk until upstream provides a fix.
# Revisit if our RSA usage changes: https://github.com/RustCrypto/RSA/issues/711
ignore = [
    { id = "RUSTSEC-2023-0071", reason = "GCS uses blinded signing; no RSA decryption endpoint. No patched release available." },
]

[bans]
# Allow multiple versions required by different dependencies.
multiple-versions = "allow"

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Zlib",
    "Unicode-3.0",
    "ISC",
    "CDLA-Permissive-2.0",
    "Unlicense",
    "CC0-1.0",
]

# dirs uses option-ext to locate platform-specific directories.
exceptions = [{ crate = "option-ext", allow = ["MPL-2.0"] }]
