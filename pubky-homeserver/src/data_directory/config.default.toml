[general]
signup_mode = "token_required"
user_storage_quota_mb = 0
# `database_url` is deliberately absent, and the fallback lives in code instead
# (`DatabaseMode::DEFAULT_DATABASE_URL`). This file is merged underneath every config read
# from disk, so a value here would make `[general].database_url` come back `Some(...)` for
# every server and destroy the one thing the `Option` is good for: telling "the operator
# chose this" apart from "nobody chose". The database-resolution rule for tests reads
# exactly that distinction. The setting is documented (commented out) in
# config.sample.toml.

[drive]
pubky_listen_socket = "127.0.0.1:6287"
icann_listen_socket = "127.0.0.1:6286"

[[drive.rate_limits]]
path = "/signup_tokens/*"
method = "GET"
quota = "10r/m"
key = "ip"

[default_quotas]

[storage]
type = "file_system"

[admin]
enabled = true
listen_socket = "127.0.0.1:6288"
admin_password = "admin"

[metrics]
enabled = false
listen_socket = "127.0.0.1:6289"

[pkdns]
public_ip = "127.0.0.1"
icann_domain = "localhost"
user_keys_republisher_interval = 14400 # 4 hours in seconds
dht_relay_nodes = ["https://pkarr.pubky.app", "https://pkarr.pubky.org"]

[logging]
level = "info"
module_levels = ["pubky_homeserver=debug", "tower_http=debug"]